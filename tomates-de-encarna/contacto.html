    <main class="panel">
      <h1>Contacto</h1>
      <p class="sub">¿Quieres preguntar algo o simplemente saludar? Escríbenos.</p>
      <div class="dos-col">
        <section>
          <p class="info-linea">📍 <b>Dónde estamos</b><br>Desde la huerta de Encarna, España</p>
          <p class="info-linea">💬 <b>WhatsApp</b><br><a data-whatsapp-link href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
          <p class="info-linea">📞 <b>Teléfono</b><br><a data-telefono href="#">+34 600 000 000</a></p>
          <p class="info-linea">🕘 <b>Horario</b><br>Lunes a sábado, de 9:00 a 14:00</p>
        </section>
        <form class="form" id="form-contacto" novalidate>
          <label class="solo-lectores" for="c-nombre">Tu nombre</label>
          <input id="c-nombre" name="nombre" type="text" placeholder="Tu nombre" autocomplete="name" maxlength="80" required>
          <label class="solo-lectores" for="c-mensaje">Tu mensaje</label>
          <textarea id="c-mensaje" name="mensaje" placeholder="Tu mensaje" maxlength="600" required></textarea>
          <p class="error" id="error-contacto" role="alert"></p>
          <button class="btn btn-whatsapp" type="submit">💬 Enviar por WhatsApp</button>
        </form>
      </div>
    </main>

    <footer class="footer">Hecho con amor por Encarna</footer>
